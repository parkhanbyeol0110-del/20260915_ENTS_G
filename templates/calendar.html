<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETNS TODO - 캘린더</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container calendar-container">
    <div class="header-row">
      <h1>{{ year }}년 {{ month }}월</h1>
      <a class="calendar-link" href="{{ url_for('index') }}">← 할 일 목록</a>
    </div>

    <div class="calendar-nav">
      <a href="{{ url_for('calendar_view', year=prev_year, month=prev_month) }}">‹ 이전 달</a>
      <a href="{{ url_for('calendar_view', year=next_year, month=next_month) }}">다음 달 ›</a>
    </div>

    <table class="calendar-table">
      <thead>
        <tr>
          <th class="sun">일</th>
          <th>월</th>
          <th>화</th>
          <th>수</th>
          <th>목</th>
          <th>금</th>
          <th class="sat">토</th>
        </tr>
      </thead>
      <tbody>
        {% for week in weeks %}
          <tr>
            {% for day in week %}
              {% if day == 0 %}
                <td class="empty-day"></td>
              {% else %}
                <td class="{{ 'today' if (year, month, day) == (today.year, today.month, today.day) else '' }}">
                  <div class="day-num">{{ day }}</div>
                  {% for todo in todos_by_day.get(day, []) %}
                    <div class="day-todo {{ 'done' if todo['done'] else '' }}">{{ todo['title'] }}</div>
                  {% endfor %}
                </td>
              {% endif %}
            {% endfor %}
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
