<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETNS TODO - 회원가입</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container auth-container">
    <h1>ETNS TODO</h1>
    <p class="auth-subtitle">새 계정을 만들어보세요</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form class="auth-form" action="{{ url_for('signup') }}" method="post">
      <input type="text" name="username" placeholder="아이디" autocomplete="username" required>
      <input type="password" name="password" placeholder="비밀번호" autocomplete="new-password" required>
      <button type="submit">회원가입</button>
    </form>

    <p class="auth-switch">
      이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a>
    </p>
  </div>
</body>
</html>
